[project]
name = "clif-icu-strain"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "clifpy==0.5.0",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
